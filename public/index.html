<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Briwill Inbox</title>
<style>
*{box-sizing:border-box}body{margin:0;height:100vh;display:flex;font:14px system-ui,sans-serif;background:#f4f5f7;color:#111}
#list{width:320px;overflow:auto;background:#fff;border-right:1px solid #ddd}
.c{padding:12px 14px;border-bottom:1px solid #eee;cursor:pointer}.c:hover,.c.on{background:#eef2ff}
.c b{display:flex;justify-content:space-between}.c small{display:block;color:#666;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u{background:#2563eb;color:#fff;border-radius:10px;padding:0 7px;font-size:12px}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#head{padding:12px 16px;background:#fff;border-bottom:1px solid #ddd;font-weight:600}
#note{display:none;padding:6px 16px;background:#fef3c7;color:#92400e;font-size:12px}
#msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:6px}
.m{max-width:70%;padding:8px 11px;border-radius:10px;background:#fff;white-space:pre-wrap;overflow-wrap:anywhere}
.m.out{align-self:flex-end;background:#dcf8c6}.m i{display:block;margin-top:3px;font-size:11px;color:#777;font-style:normal}
.m i.err{color:#b91c1c}
#bar{display:flex;gap:8px;padding:10px;background:#fff;border-top:1px solid #ddd}
#bar input{flex:1;padding:10px;border:1px solid #ccc;border-radius:8px}
#bar button{padding:0 18px;border:0;border-radius:8px;background:#2563eb;color:#fff}
#bar:has(input:disabled){opacity:.5}
@media(max-width:700px){body{flex-direction:column}#list{width:100%;height:35%}}
</style></head><body>
<div id="list"></div>
<div id="main"><div id="head">Select a conversation</div><div id="note"></div>
<div id="msgs"></div>
<div id="bar"><input id="txt" placeholder="Type a reply" disabled><button id="go">Send</button></div></div>
<script>
let pw = sessionStorage.pw || prompt("Admin password"), cur = null, curName = "";
sessionStorage.pw = pw || "";
const $ = (id) => document.getElementById(id);
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
async function api(path, opt = {}) {
  const r = await fetch(path, { ...opt, headers: { "x-admin-password": pw, "Content-Type": "application/json" } });
  if (r.status === 401) { sessionStorage.removeItem("pw"); location.reload(); }
  return r.json();
}
async function loadList() {
  const { conversations = [] } = await api("/api/conversations");
  const list = $("list"); list.replaceChildren();
  for (const c of conversations) {
    const d = el("div", "c" + (c.wa_id === cur ? " on" : ""));
    const top = el("b", null, c.name || "+" + c.wa_id);
    if (c.unread > 0) top.append(el("span", "u", c.unread));
    d.append(top, el("small", null, c.last_body || ""));
    d.onclick = () => { cur = c.wa_id; curName = c.name || "+" + c.wa_id; loadList(); loadThread(); };
    list.append(d);
  }
}
async function loadThread() {
  if (!cur) return;
  const { messages = [], last_inbound_at } = await api("/api/messages?wa_id=" + cur);
  $("head").textContent = curName;
  const box = $("msgs"), stick = box.scrollTop + box.clientHeight >= box.scrollHeight - 40;
  box.replaceChildren();
  for (const m of messages) {
    const d = el("div", "m " + m.direction, m.body);
    const t = new Date(m.created_at).toLocaleString();
    d.append(el("i", m.error ? "err" : "", m.direction === "out" ? `${t} · ${m.status}${m.error ? " · " + m.error : ""}` : t));
    box.append(d);
  }
  if (stick) box.scrollTop = box.scrollHeight;
  const open = last_inbound_at && Date.now() - new Date(last_inbound_at) < 864e5;
  $("txt").disabled = !open;
  $("note").style.display = open ? "none" : "block";
  $("note").textContent = "24-hour window closed. You can only send approved templates to this contact.";
}
async function send() {
  const text = $("txt").value.trim(); if (!text || !cur) return;
  $("txt").value = "";
  const r = await api("/api/send", { method: "POST", body: JSON.stringify({ to: cur, text }) });
  if (r.error) alert(r.error);
  loadThread(); loadList();
}
$("go").onclick = send;
$("txt").onkeydown = (e) => { if (e.key === "Enter") send(); };
loadList(); setInterval(() => { loadList(); loadThread(); }, 8000);
</script></body></html>
